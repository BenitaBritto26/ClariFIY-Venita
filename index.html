<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Input Example</title>
</head>
<body>


    <h2>Start entry below!</h2>
    
    <label for="userInput">Type:</label>
    <input class="flex-container" type="text" id="dynamic-input" style="min-width: 120px;"  placeholder="Type here...">
    <button id="submitBtn">Display Text</button>

    <h3>Dear me,</h3>
    <p id="displayText">Your entry will appear here.</p>

    <script>
        // Select the HTML elements using their unique IDs
        const submitButton = document.getElementById('submitBtn');
        const displayParagraph = document.getElementById('displayText');

        // Add an event listener to detect when the button is clicked
        submitButton.addEventListener('click', function() {
            // Get the current text value inside the input box
            const textValue = input.value;

            // Update the paragraph text with the user's input
            displayParagraph.textContent = textValue;
        });

        
        const input = document.getElementById('dynamic-input');
  
            input.addEventListener('input', function() {
                // Increase size attribute or pixel width proportionally 
                this.style.width = (this.value.length + 2) + 'ch'; 
            });

        
    </script>

</body>
</html>
