<!DOCTYPE html>
<html>
    
    <style>
        @font-face {
            font-family: myFont;
            src: url('Hugh is Life Personal Use .ttf');
        
        }
        .square {
            margin-top: 50px;
            margin-bottom: 30px;
            margin-right: auto;
            margin-left: auto;

            /*Make height modular*/
            height: 190vh;
            width: 90vw;
            opacity: 0.75;
            border-radius: 15px;
            background-color: #ffffff;
        }

        .topbar {
            position: relative;
            width: 100%;
            height: 50px;
            z-index: 1;

        }

        .rectangle {
            width: 100%;
            margin-left: 0;
            margin-right: 0;
            height: 65px;
            background-color: #ffffff;

            color: rgb(161, 46, 65);
            text-align: center;
            font-size: 60px;

        }

        .center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
        }

        body {
            font-family: myFont;
            color: black;
            background-image: url('pinkClariFIYbg.png');
            background-position: center;
            background-size: cover;
            background-attachment: fixed;

            margin: 0;
            padding: 0;
        }

        .img_container {
            position: relative;
            width: 100%;
            height: 10px;
        }

        .img_container img {
            position: absolute;
            width: 100px;
        }
        
        .homeIcon {
            position: absolute;
            top: 1px;
            left: 1px;
            width: clamp(40px, 5vw, 80px);
            height: auto;
            z-index: 2;
            cursor: pointer;

        }

        .journal-panel {
            position: relative;
            width: 90vw;
            margin: 30px auto;
        }


        .entry-area{
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            z-index:2;
            font-size: 30px;
        }

        textarea {
            width: 100%;
            height: 100px;
            resize: none;
            overflow: hidden;
            font-family: myFont;
            font-size: 30px;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        #displayText {
            white-space: pre-wrap;
            word-wrap: break-wrod;
            overflow-wrap: break-word;
        }

        .entry-area p{
            display: block;
            margin: 10px 0;
        }

        img {

            position: relative;
        }

        
        
    </style>

    <!-- Webpage title (in tab) -->
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>ClariFIY</title>
    </head>
    
    <body>
        <!-- <h1>ClariFIY</h1> -->

        <div class="topbar">
            <div class="rectangle">ClariFIY</div>
            <img src="bruiserIcon.png" class="homeIcon" alt="Close Journal!">
        </div>

        <div class="container"></div>
        <!-- <div class="center"></div> -->

        <div class="journal-panel">
            
            <div class="square"></div>
            <div class="entry-area">
                <h1>Start entry below!</h1>
                <h3>Dear me,</h3>
                <label for="userInput">Type:</label>
                <input class="flex-container" type="text" id="dynamic-input" name="userInput" style="min-width: 120px;"  placeholder="Type here...">
                <button id="submitBtn">Submit</button>
                
                <p id="displayText">Your entry will appear here.</p>


            </div>
        </div>

        <script src="script.js"></script>




        <script>
        const submitButton = document.getElementById('submitBtn');
        const displayParagraph = document.getElementById('displayText');
        const input = document.getElementById('dynamic-input');

        function resizeTextarea() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        }

        input.addEventListener('input', function() {
                resizeTextarea.call();
        });

        submitButton.addEventListener('click', function() {
            const textValue = input.value;
            displayParagraph.textContent = textValue;
        });

        
                

        
        </script>



    </body>
</html>
